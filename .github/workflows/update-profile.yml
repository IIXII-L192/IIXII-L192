name: Update contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "7 0 * * *"
  push:
    paths-ignore:
      - "contrib-heatmap.svg"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh animated contribution graph
        run: python scripts/generate_contributions.py

      - name: Commit generated contribution graph
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git commit -m "chore: refresh contribution graph"
          git push
