name: Update profile art

on:
  workflow_dispatch:
  schedule:
    - cron: "7 0 * * *"
  push:
    paths-ignore:
      - "contrib-heatmap.svg"
      - "profile-views.svg"
      - "data/profile-views.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh animated contribution graph
        run: python scripts/generate_contributions.py

      - name: Sample existing Getloli counter once for today
        run: python scripts/update_profile_views.py

      - name: Render smooth profile-view graph
        run: python scripts/render_profile_views.py

      - name: Commit generated profile art
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg profile-views.svg data/profile-views.json
          git commit -m "chore: refresh profile art"
          git push
