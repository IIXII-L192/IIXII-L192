<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300"
viewBox="0 0 860 300" role="img" aria-label="GitHub profile views statistics">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0B0F15"/>
    <stop offset="1" stop-color="#05080D"/>
  </linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#62CCFF" stop-opacity=".42"/>
    <stop offset="1" stop-color="#62CCFF" stop-opacity=".02"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="860" height="300" rx="18" fill="url(#bg)"/>
<rect x=".5" y=".5" width="859" height="299" rx="17.5"
      fill="none" stroke="#1B2837"/>
<text x="44" y="31" fill="#EDF7FF" font-family="Arial,Helvetica,sans-serif"
      font-size="18" font-weight="700">GitHub profile views statistics</text>
<text x="836" y="31" text-anchor="end" fill="#627D97"
      font-family="Arial,Helvetica,sans-serif" font-size="12">last 30 days</text>
<line x1="44" y1="52.00" x2="836" y2="52.00" stroke="#172231" stroke-width="1" stroke-dasharray="4 7"/><line x1="44" y1="103.50" x2="836" y2="103.50" stroke="#172231" stroke-width="1" stroke-dasharray="4 7"/><line x1="44" y1="155.00" x2="836" y2="155.00" stroke="#172231" stroke-width="1" stroke-dasharray="4 7"/><line x1="44" y1="206.50" x2="836" y2="206.50" stroke="#172231" stroke-width="1" stroke-dasharray="4 7"/><line x1="44" y1="258.00" x2="836" y2="258.00" stroke="#172231" stroke-width="1" stroke-dasharray="4 7"/>

  <circle cx="440.00" cy="155.00" r="7" fill="#071019"
          stroke="#78D8FF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="440.00" cy="155.00" r="13" fill="none"
          stroke="#78D8FF" stroke-opacity=".22" stroke-width="2"/>
  <text x="440.00" y="133.00" text-anchor="middle"
        fill="#86A4BE" font-size="12">collecting daily history</text>

<text x="440.00" y="284" text-anchor="middle" fill="#7f95ad" font-size="12">07 Aug</text>
</svg>
